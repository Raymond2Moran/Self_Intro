- title: pppower
  focus: Power and sample size planning
  summary: R tools for planning studies that use prediction-powered inference.
  contribution: Co-developed the R package, with modular functions, CI testing, documentation, and simulation studies of statistical performance.
  tools: R · Monte Carlo simulation · CI/testing
  links:
