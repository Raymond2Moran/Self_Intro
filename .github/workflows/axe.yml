name: Site accessibility and responsive checks

on:
  pull_request:
    branches: [main, master, redesign]
  push:
    branches: [main, master, redesign]
    paths:
      - "_pages/**"
      - "_includes/**"
      - "_layouts/**"
      - "_sass/**"
      - "_data/**"
      - "_bibliography/**"
      - "_scripts/check-site.mjs"
      - "_config.yml"
      - "assets/**"
      - "Gemfile"
      - "Gemfile.lock"
      - "requirements.txt"
      - ".github/workflows/axe.yml"
  workflow_dispatch:

# Replace superseded PR checks; let an in-progress production deployment finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install image dependencies
        run: |
          if ! command -v convert >/dev/null 2>&1 || ! command -v identify >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends imagemagick
          fi
          convert -version
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Build site for checks
        run: JEKYLL_ENV=production bundle exec jekyll build --baseurl ""
      - name: Verify generated responsive images
        run: |
          identify _site/assets/img/Self_photo_business_casual-480.webp
          identify _site/assets/img/publication_preview/preview_paper-480.webp
          identify _site/assets/img/publication_preview/preview_pppower-480.webp
      - name: Install browser checks and purge CSS
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2 purgecss@7.0.2
          npx purgecss -c purgecss.config.js
          npx playwright install --with-deps chromium
      - name: Check main pages
        run: |
          python -m http.server 8080 --directory _site &
          node _scripts/check-site.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-check-screenshots
          path: /tmp/self-intro-checks/
          if-no-files-found: ignore
