name: Site accessibility and responsive checks

on:
  pull_request:
    branches: [main, master, redesign]
  push:
    branches: [main, master, redesign]
    paths:
      - "_pages/**"
      - "_includes/**"
      - "_layouts/**"
      - "_sass/**"
      - "_data/**"
      - "_bibliography/**"
      - "_scripts/check-site.mjs"
      - "_config.yml"
      - "assets/**"
      - "Gemfile"
      - ".github/workflows/axe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build site for checks
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip install nbconvert
          JEKYLL_ENV=production bundle exec jekyll build --baseurl ""
      - name: Install browser checks and purge CSS
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2 purgecss@7.0.2
          npx purgecss -c purgecss.config.js
          npx playwright install --with-deps chromium
      - name: Check main pages
        run: |
          python -m http.server 8080 --directory _site &
          node _scripts/check-site.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-check-screenshots
          path: /tmp/self-intro-checks/
          if-no-files-found: ignore
